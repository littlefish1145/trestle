schema_version = 7

[project]
name = "hello-workspace"

[build]
profile = "debug"
build_dir = "build"
cxx_standard = "c++20"
compile_commands = "compile_commands.json"

# Members inherit portable compiler selection. Override locally with
# trestle configure -toolchain <compiler> when a specific compiler is required.
[toolchain]
cxx = "auto"
msvc = "auto"

[workspace]
members = ["core", "cli"]
