name: Alpha Release Logs

on:
  workflow_run:
    workflows:
      - Alpha Release
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  attach-logs:
    name: Attach complete Actions logs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the completed workflow log archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -Eeuo pipefail
          short_sha=${HEAD_SHA:0:7}
          release_tag="alpha-${RUN_NUMBER}-${short_sha}"
          log_name="github-actions-${release_tag}-attempt-${RUN_ATTEMPT}.zip"

          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output "$log_name" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/logs"

          test -s "$log_name"
          gh release upload "$release_tag" "$log_name" --repo "$REPOSITORY" --clobber

          {
            echo "## Actions logs attached"
            echo
            echo "- Release: \`$release_tag\`"
            echo "- Asset: \`$log_name\`"
            echo "- Source run: $RUN_ID (attempt $RUN_ATTEMPT)"
          } >> "$GITHUB_STEP_SUMMARY"
