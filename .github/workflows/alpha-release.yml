name: Alpha Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check workflow expressions and shell scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - name: Compute immutable Alpha identity
        id: metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          short_sha=${COMMIT_SHA:0:7}
          tag="alpha-${RUN_NUMBER}-${short_sha}"
          build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          {
            echo "tag=$tag"
            echo "version=$tag"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Alpha release"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Build date: \`$build_date\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Test and vet (${{ matrix.os }})
    needs: workflow-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: windows-latest
            compiler: clang-cl
          - os: macos-latest
            compiler: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify modules
        run: |
          set -Eeuo pipefail
          mkdir -p quality-logs
          log="quality-logs/go-mod-verify-${RUNNER_OS}-${RUNNER_ARCH}.log"
          printf 'Command: go mod verify\n' | tee "$log"
          go mod verify 2>&1 | tee -a "$log"

      - name: Run tests
        run: |
          set -Eeuo pipefail
          log="quality-logs/go-test-${RUNNER_OS}-${RUNNER_ARCH}.log"
          printf 'Command: go test -count=1 -timeout=8m ./...\n' | tee "$log"
          go test -count=1 -timeout=8m ./... 2>&1 | tee -a "$log"

      - name: Stress workspace and CUDA planning contracts
        run: |
          set -Eeuo pipefail
          log="quality-logs/go-stress-${RUNNER_OS}-${RUNNER_ARCH}.log"
          go test -count=20 -shuffle=on -timeout=5m \
            ./internal/config ./internal/graph ./internal/plan ./internal/ninja ./internal/toolchain/cuda ./internal/sdk/vulkan \
            -run 'Workspace|MemberDir|CUDA|CompileExact|DeviceLink|InvalidToolchain|DetectAndProbe|ToolkitRoot|MultiInput|ReplacePaths|Vulkan|Shader|CompileExactShader|WSLDirectory|DetectRoot|StageAndTool|UnsafeGlslc' 2>&1 | tee "$log"

      - name: Fuzz workspace paths and target selectors
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          go test ./internal/config -run '^$' -fuzz '^FuzzMemberDirCannotEscapeRoot$' -fuzztime=10s -parallel=2 2>&1 | tee quality-logs/fuzz-path.log
          go test ./internal/app -run '^$' -fuzz '^FuzzSplitWorkspaceTargets$' -fuzztime=10s -parallel=2 2>&1 | tee quality-logs/fuzz-target.log

      - name: Prepare native integration tools
        env:
          TRESTLE_TEST_COMPILER: ${{ matrix.compiler }}
        run: |
          set -Eeuo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            tools="$RUNNER_TEMP/trestle-ci-tools"
            if [[ "$RUNNER_OS" == Windows ]]; then
              tools=$(cygpath -u "$tools")
              python -m venv "$tools"
              tools_bin="$tools/Scripts"
              tools_python="$tools_bin/python.exe"
              cygpath -w "$tools_bin" >> "$GITHUB_PATH"
            else
              python3 -m venv "$tools"
              tools_bin="$tools/bin"
              tools_python="$tools_bin/python"
              echo "$tools_bin" >> "$GITHUB_PATH"
            fi
            "$tools_python" -m pip --disable-pip-version-check install ninja
            export PATH="$tools_bin:$PATH"
          fi
          ninja --version
          command -v "$TRESTLE_TEST_COMPILER"
          "$TRESTLE_TEST_COMPILER" --version

      - name: Build and run native workspace examples
        env:
          TRESTLE_TEST_NATIVE: '1'
          TRESTLE_TEST_COMPILER: ${{ matrix.compiler }}
        run: |
          set -Eeuo pipefail
          log="quality-logs/go-native-${RUNNER_OS}-${RUNNER_ARCH}.log"
          go test -count=1 -timeout=5m ./internal/app \
            -run 'TestRealNativeCPPBuild|TestRealWorkspaceCleanSelectedMemberAndProfiles' 2>&1 | tee "$log"

      - name: Install Vulkan shader validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc glslang-tools spirv-tools

      - name: Compile and validate real Vulkan shaders
        if: runner.os == 'Linux'
        env:
          TRESTLE_TEST_VULKAN: '1'
          TRESTLE_TEST_VULKAN_ROOT: /usr
        run: |
          set -Eeuo pipefail
          go test -count=1 -v -timeout=5m ./internal/app -run TestRealVulkanNativeBuildAndIncrementalDependencies 2>&1 | tee quality-logs/vulkan-integration.log

      - name: Detect data races
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          log="quality-logs/go-race-${RUNNER_OS}-${RUNNER_ARCH}.log"
          go test -race -count=1 -timeout=8m ./... 2>&1 | tee "$log"

      - name: Enforce VS Code generator coverage
        run: |
          set -Eeuo pipefail
          log="quality-logs/go-test-vscode-cover-${RUNNER_OS}-${RUNNER_ARCH}.log"
          printf 'Command: go test -count=1 -covermode=atomic -coverprofile=quality-logs/vscode-cover.out ./internal/vscode/...\n' | tee "$log"
          go test -count=1 -covermode=atomic -coverprofile=quality-logs/vscode-cover.out ./internal/vscode/... 2>&1 | tee -a "$log"
          go tool cover -func=quality-logs/vscode-cover.out | tail -n 1 | tee -a "$log"
          total=$(go tool cover -func=quality-logs/vscode-cover.out | tail -n 1 | sed -E 's/.*[[:space:]]([0-9]+([.][0-9]+)?)%$/\1/')
          awk -v total="$total" 'BEGIN { if (total + 0 < 95) { printf "internal/vscode coverage is %.2f%%, below the 95%% requirement\n", total; exit 1 } }'
          printf 'internal/vscode coverage: %s%% (>= 95%%)\n' "$total"

      - name: Run go vet
        run: |
          set -Eeuo pipefail
          log="quality-logs/go-vet-${RUNNER_OS}-${RUNNER_ARCH}.log"
          printf 'Command: go vet ./...\n' | tee "$log"
          go vet ./... 2>&1 | tee -a "$log"

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-quality-logs-${{ runner.os }}-${{ runner.arch }}
          path: quality-logs/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: github.event_name != 'pull_request'
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build installation package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          OUTPUT_DIR: dist
        run: bash scripts/release/package.sh

      - name: Verify archive layout and PATH installer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          package="trestle-${VERSION}-${GOOS}-${GOARCH}"
          verify_root=$(mktemp -d)
          trap 'rm -rf "$verify_root"' EXIT
          mkdir -p "$verify_root/extracted"

          jq -e \
            --arg goos "$GOOS" \
            --arg goarch "$GOARCH" \
            --arg version "$VERSION" \
            '.goos == $goos and .goarch == $goarch and .version == $version' \
            "dist/${package}.json" >/dev/null

          if [[ "$GOOS" == windows ]]; then
            unzip -q "dist/${package}.zip" -d "$verify_root/extracted"
            test -s "$verify_root/extracted/$package/bin/trestle.exe"
            test -s "$verify_root/extracted/$package/install.ps1"
            path_file="$verify_root/github-path"
            GITHUB_PATH="$path_file" pwsh -NoProfile -File "$verify_root/extracted/$package/install.ps1" \
              -InstallDir "$verify_root/installed"
            grep -F "$verify_root/installed/bin" "$path_file" >/dev/null
            test -s "$verify_root/installed/bin/trestle.exe"
          else
            tar -xzf "dist/${package}.tar.gz" -C "$verify_root/extracted"
            test -s "$verify_root/extracted/$package/bin/trestle"
            test -x "$verify_root/extracted/$package/install.sh"
            path_file="$verify_root/github-path"
            GITHUB_PATH="$path_file" TRESTLE_INSTALL_DIR="$verify_root/installed" \
              sh "$verify_root/extracted/$package/install.sh" --no-profile
            grep -F "$verify_root/installed/bin" "$path_file" >/dev/null
            test -x "$verify_root/installed/bin/trestle"
          fi

          if [[ "$GOOS/$GOARCH" == linux/amd64 ]]; then
            "$verify_root/extracted/$package/bin/trestle" version | grep -F "$VERSION"
          fi

      - name: Upload target package and build record
        uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize target
        env:
          TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Package complete"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Version: \`$VERSION\`"
            echo "- Installer adds the package's \`bin\` directory to PATH."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub Alpha prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - prepare
      - quality
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums, manifest, and commit record
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -Eeuo pipefail
          cd dist

          empty_asset=$(find . -maxdepth 1 -type f -empty -print -quit)
          if [[ -n "$empty_asset" ]]; then
            echo "::error file=dist/${empty_asset#./}::Release asset is empty"
            exit 1
          fi

          sha256sum trestle-*.tar.gz trestle-*.zip > SHA256SUMS.txt
          jq -s \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$COMMIT_SHA" \
            --arg build_date "$BUILD_DATE" \
            '{tag:$tag, commit:$commit, build_date:$build_date, packages:.}' \
            trestle-*.json > release-manifest.json

          {
            echo "Release tag: $RELEASE_TAG"
            echo "Version: $RELEASE_VERSION"
            echo "Commit: $COMMIT_SHA"
            echo "Build date: $BUILD_DATE"
            echo "Workflow: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
            echo
            git -C "$GITHUB_WORKSPACE" show -s --format=fuller "$COMMIT_SHA"
          } > COMMIT.txt

      - name: Generate detailed release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -Eeuo pipefail
          subject=$(git show -s --format=%s "$COMMIT_SHA")
          author=$(git show -s --format='%an <%ae>' "$COMMIT_SHA")
          previous=$(git tag --list 'alpha-*' --sort=-creatordate | grep -Fvx "$RELEASE_TAG" | head -n 1 || true)
          commit_format="- [\`%h\`](${SERVER_URL}/${REPOSITORY}/commit/%H) %s — %an"

          {
            echo "Automated desktop Alpha build from \`main\`."
            echo
            echo "## Source"
            echo
            echo "- Commit: [\`$COMMIT_SHA\`]($SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA)"
            echo "- Subject: $subject"
            echo "- Author: $author"
            echo "- Built: \`$BUILD_DATE\`"
            echo "- Workflow: [run $RUN_ID]($SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID)"
            echo
            echo "## Desktop packages"
            echo
            echo "| OS | Architectures | Format |"
            echo "|---|---|---|"
            echo "| Windows | x64, ARM64 | ZIP |"
            echo "| Linux | x64, ARM64 | tar.gz |"
            echo "| macOS | Intel x64, Apple Silicon ARM64 | tar.gz |"
            echo
            echo "Every archive contains \`bin/trestle\` (or \`trestle.exe\`) plus \`install.sh\` and \`install.ps1\`. The installer copies the complete package and adds its \`bin\` directory to PATH; in GitHub Actions it writes to \`GITHUB_PATH\`."
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`. Machine-readable package metadata is in \`release-manifest.json\`. Full GitHub Actions logs are attached after this workflow completes."
            echo
            echo "## Changes"
            echo
            if [[ -n "$previous" ]]; then
              git log "$previous..$COMMIT_SHA" --pretty=format:"$commit_format"
            else
              git log -n 20 "$COMMIT_SHA" --pretty=format:"$commit_format"
            fi
            echo
          } > release-notes.md

      - name: Create annotated Alpha tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            subject=$(git show -s --format=%s "$COMMIT_SHA")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$COMMIT_SHA" \
              -m "Trestle Alpha $RELEASE_TAG" \
              -m "Commit: $COMMIT_SHA" \
              -m "Subject: $subject" \
              -m "Built: $BUILD_DATE" \
              -m "GitHub Actions run: $RUN_ID"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create or repair Alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          title="Trestle Alpha ${RELEASE_TAG#alpha-}"
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
            gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi

      - name: Publish release summary
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          {
            echo "## Published"
            echo
            echo "[$RELEASE_TAG]($SERVER_URL/$REPOSITORY/releases/tag/$RELEASE_TAG)"
            echo
            echo "The follow-up **Alpha Release Logs** workflow will attach the complete run log archive."
          } >> "$GITHUB_STEP_SUMMARY"
