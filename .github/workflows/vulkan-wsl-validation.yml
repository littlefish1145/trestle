name: WSL Vulkan Validation

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: WSL distribution with glslc, glslangValidator and spirv-val
        required: true
        default: ArchLinux
        type: string

permissions:
  contents: read

jobs:
  vulkan:
    runs-on: [self-hosted, Windows, X64, wsl-vulkan]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require WSL shader compilers and validate SPIR-V
        shell: pwsh
        env:
          TRESTLE_TEST_WSL_VULKAN: '1'
          TRESTLE_WSL_DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          New-Item -ItemType Directory -Force quality-logs | Out-Null
          go test -count=1 -v -timeout=10m ./internal/app -run TestRealWSLVulkanBuildAndIncrementalDependencies 2>&1 | Tee-Object quality-logs/vulkan-wsl.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-wsl-validation-logs
          path: quality-logs/
          if-no-files-found: error
