[package]
name = "trestle-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui"]

[dependencies]
gpui = { version = "=0.2.2", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[[bin]]
name = "trestle-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0
