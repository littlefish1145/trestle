schema_version = 7

[project]
  name = "."

[build]
  profile = "release"
  build_dir = "build"
  c_standard = "c17"
  cxx_standard = "c++20"
  compile_flags = ["-Os", "-ffunction-sections", "-fdata-sections", "-DNDEBUG"]
  c_flags = []
  cxx_flags = []
  link_flags = ["-Wl,--gc-sections"]
  default_targets = ["app"]
  compile_commands = "compile_commands.json"
  auto_compile_shaders = true
  modules = false
  module_scanner = ""

[toolchain]
  msvc = "14.30~14.50"
  c = "clang-cl"
  cxx = "clang-cl"
  archiver = "auto"
  linker = "auto"
  setup = ""
  cuda = ""
  cuda_root = ""
  cache_dir = ".trestle/toolchain"
  cuda_mode = "whole"
  cuda_architectures = ["sm_75"]
  cuda_execution = "native"
  cuda_wsl_distribution = ""
  vulkan = ""
  vulkan_execution = "native"
  vulkan_wsl_distribution = ""
  module_scanner = ""
  mode = "native"
  wsl_distribution = ""
  preset = ""

[vcpkg]
  root = ""
  triplet = "auto"
  crt_linkage = ""
  library_linkage = ""

[compiler_presets]

[targets]
  [targets.app]
    when = ""
    requires_wsl = ""
    type = "executable"
    sources = ["src/main.cpp"]
    output_name = "."
    c_standard = ""
    cxx_standard = ""
    export_all_symbols = false
    include_dirs = []
    private_include_dirs = []
    library_dirs = []
    shader_stage = ""
    shader_entry = ""
    shader_tool = ""
    shader_target_env = ""
    dependencies = []
    test_group = ""
    test_working_dir = ""

[packages]

[package]
  format = "zip"
  output = "dist/..zip"
  optimization = "size"
  targets = ["app"]
